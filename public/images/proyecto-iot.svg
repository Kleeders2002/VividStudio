<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ventana del navegador -->
  <rect x="60" y="50" width="680" height="500" rx="16" fill="#0b1220" stroke="#334155"/>
  <rect x="60" y="50" width="680" height="44" rx="16" fill="#111c30"/>
  <circle cx="90" cy="72" r="6" fill="#f87171"/>
  <circle cx="112" cy="72" r="6" fill="#fbbf24"/>
  <circle cx="134" cy="72" r="6" fill="#34d399"/>
  <rect x="170" y="62" width="360" height="20" rx="10" fill="#1e293b"/>
  <!-- Header dashboard -->
  <text x="100" y="150" fill="#f1f5f9" font-size="22" font-weight="700">Panel de Monitoreo IoT</text>
  <rect x="620" y="130" width="80" height="28" rx="14" fill="#164e63"/>
  <text x="638" y="149" fill="#22d3ee" font-size="12">En vivo</text>
  <circle cx="612" cy="144" r="4" fill="#22d3ee"/>
  <!-- Tarjetas de sensores -->
  <g>
    <rect x="100" y="180" width="180" height="90" rx="12" fill="#111c30" stroke="#1e3a5f"/>
    <text x="118" y="212" fill="#94a3b8" font-size="11">TEMPERATURA</text>
    <text x="118" y="248" fill="#22d3ee" font-size="28" font-weight="700">24.6°C</text>
    <rect x="300" y="180" width="180" height="90" rx="12" fill="#111c30" stroke="#1e3a5f"/>
    <text x="318" y="212" fill="#94a3b8" font-size="11">HUMEDAD</text>
    <text x="318" y="248" fill="#8b5cf6" font-size="28" font-weight="700">58%</text>
    <rect x="500" y="180" width="180" height="90" rx="12" fill="#111c30" stroke="#1e3a5f"/>
    <text x="518" y="212" fill="#94a3b8" font-size="11">SEÑAL</text>
    <text x="518" y="248" fill="#34d399" font-size="28" font-weight="700">-52dB</text>
  </g>
  <!-- Gráfica de telemetría -->
  <rect x="100" y="300" width="580" height="210" rx="12" fill="#111c30" stroke="#1e3a5f"/>
  <text x="120" y="332" fill="#94a3b8" font-size="12">Telemetría — últimas 24h</text>
  <polyline points="120,480 180,450 240,465 300,410 360,430 420,380 480,400 540,350 600,365 660,330"
    fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <g fill="#22d3ee">
    <circle cx="300" cy="410" r="4"/><circle cx="480" cy="400" r="4"/><circle cx="660" cy="330" r="4"/>
  </g>
  <line x1="120" y1="490" x2="660" y2="490" stroke="#1e3a5f"/>
</svg>
